  l.pieces.forEach((p,id)=>{let at=state.positions[id];if(at<0)return;const c=colors[p.color],x=at%l.width*S,y=Math.floor(at/l.width)*S,isSelected=id===selected;
   parts.push(`<g class="piece" data-piece="${id}" role="button" tabindex="0" aria-label="${c.name}块${isSelected?'，已选中':''}" aria-pressed="${isSelected}"><rect class="piece-outline" x="${x+4}" y="${y+3}" width="56" height="58" rx="17" fill="none" stroke="${isSelected?c.dark:'transparent'}" stroke-width="2"/><g filter="url(#block-shadow)"><rect x="${x+10}" y="${y+13}" width="44" height="43" rx="12" fill="${c.dark}"/><rect x="${x+10}" y="${y+7}" width="44" height="43" rx="12" fill="${c.hex}"/><path d="M${x+19} ${y+15}h14" stroke="#fffdf5" stroke-opacity=".32" stroke-width="3" stroke-linecap="round"/>${O.stamp(wallet.piecePatterns[id],p.color,x+32,y+29,13,'#fff7e8')}${wallet.piecePatterns[id]!=='original'?shape(p.color,x+49,y+45,3,c.dark):''}</g></g>`);
  });
  if(hintMove){const [id,d]=hintMove,at=state.positions[id],x=at%l.width*S+32,y=Math.floor(at/l.width)*S+32,[dx,dy]=E.DIRS[d];parts.push(`<g class="hint-arrow"><text x="${x+dx*38}" y="${y+dy*38+8}" text-anchor="middle" fill="#293b35" font-size="28" font-family="Arial" font-weight="bold">${['↑','→','↓','←'][d]}</text></g>`);}
  $('board').innerHTML=parts.join('');$('board').dataset.busy=String(animating);
 }
 function render(){
  const l=level(),correct=l.targets.filter(t=>state.paint[t.cell]===t.color).length;
  $('move-count').textContent=String(state.moves);
  $('level-number').innerHTML=`<small>关卡</small><b>${String(index+1).padStart(2,'0')}</b>`;
  $('target-progress').innerHTML=`${correct} <em>/ ${l.targets.length}</em>`;
  const c=colors[l.pieces[selected].color];$('pad-piece').style.color=c.hex;$('pad-piece').innerHTML=O.svg(wallet.piecePatterns[selected],l.pieces[selected].color);
  $('undo').disabled=!history.length;const won=E.won(l,state),dead=needsUndo();syncControls();
  updateLevels();
  renderBoard();$('outcome').hidden=!(won||dead);
  if(won){$('outcome').innerHTML=`<h3>完成</h3>${starMarkup(W.stars(state.moves,l.par))}<div class="win-reward">${state.reward?.amount?`<span class="coin-mark" aria-hidden="true">●</span> +${state.reward.amount} 金币`:'<span class="reward-claimed">本关奖励已领取</span>'}</div><div class="win-rating">${state.moves} 步 · 三星 ≤ ${l.par+2} 步 · 二星 ≤ ${l.par+6} 步</div><button class="primary" data-action="next">${index===levels.length-1?'选关':'下一关'} →</button><button class="secondary" data-action="replay">重玩</button>${index===levels.length-1?'<button class="finale-again" data-action="finale">再看小动画</button>':''}`;}
  else if(dead){$('outcome').innerHTML=`<span class="outcome-icon" style="color:#d69b6b" aria-hidden="true">↶</span><h3>${l.barriers.length||l.portals.length?'换个走法试试':'需要调整顺序'}</h3><p>${l.barriers.length?'撤销上一步，挡板也会恢复。':'撤销上一步后继续。'}</p><button class="primary" data-action="undo">撤销这一步</button>`;}
 }
 function hint(){if(animating)return;const result=E.solve(level(),state);if(!result?.actions.length){note('当前路线走不通了。试着撤销几步，或者重新开始。',4500);return;}hintMove=result.actions[0];selected=hintMove[0];render();note(`试试让${colors[level().pieces[selected].color].name}块向${directions[hintMove[1]]}滑。`,4000);}
 document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(Number(b.dataset.dir))));
 $('undo').addEventListener('click',undo);$('reset').addEventListener('click',reset);$('hint').addEventListener('click',hint);
 $('back-home').addEventListener('click',showHome);$('level-menu').addEventListener('click',showLevels);
 $('start-game').addEventListener('click',start);
 $('levels').addEventListener('click',e=>{const b=e.target.closest('[data-level]');if(b)requestLevel(Number(b.dataset.level));});
 $('outcome').addEventListener('click',e=>{const a=e.target.dataset.action;if(a==='next'){if(index===levels.length-1)showLevels();else requestLevel(index+1);}if(a==='replay')reset();if(a==='undo')undo();if(a==='finale')finale();});
 $('help').addEventListener('click',()=>window.StrokeGuide.open(screen==='game'?tutorialFor(index):'intro'));
 $('sound').addEventListener('click',()=>{sound=!sound;$('sound').setAttribute('aria-label',sound?'关闭音效':'开启音效');$('sound').title=sound?'关闭音效':'开启音效';$('sound').classList.toggle('on',sound);tone();});
 let gesture=null;
 $('board').addEventListener('pointerdown',e=>{if(animating||E.won(level(),state)||needsUndo())return;const p=e.target.closest('[data-piece]');if(p)select(Number(p.dataset.piece));gesture={x:e.clientX,y:e.clientY,id:e.pointerId};$('board').setPointerCapture(e.pointerId);});
 $('board').addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0);});
 $('board').addEventListener('pointercancel',()=>gesture=null);
 document.addEventListener('keydown',e=>{
  if(screen!=='game'||document.querySelector('dialog[open]')||e.altKey)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(e.ctrlKey||e.metaKey)return;
  if(e.key==='1'||e.key==='2'){e.preventDefault();select(Number(e.key)-1);return;}
  const d={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3}[e.key.length===1?e.key.toLowerCase():e.key];if(d!==undefined){e.preventDefault();move(d);return;}
  if(e.key==='Tab'&&document.activeElement?.closest('#board')){e.preventDefault();const available=state.positions.map((p,i)=>p>=0?i:-1).filter(i=>i>=0);if(available.length){select(available[(available.indexOf(selected)+1)%available.length]);document.querySelector(`[data-piece="${selected}"]`)?.focus();}}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-piece]')){e.preventDefault();select(Number(e.target.closest('[data-piece]').dataset.piece));}
 });
 load(index);showHome();
})();

</script></body></html>
